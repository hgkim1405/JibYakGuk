[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jibyakguk-python"
version = "0.1.0"
description = "Internal API and future intelligence modules for JibYakGuk"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
